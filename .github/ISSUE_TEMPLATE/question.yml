name: 💡 Question / idea — Câu hỏi / ý tưởng
description: Ask how something works or suggest an improvement for Storyline. / Hỏi cách dùng hoặc đề xuất cải tiến cho Storyline.
labels: ["question"]
body:
  - type: textarea
    id: question
    attributes:
      label: Your question or idea / Câu hỏi hoặc ý tưởng của bạn
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context / Bối cảnh
      description: What are you trying to do? Which model / setup? / Bạn đang muốn làm gì? Model / thiết lập nào?
